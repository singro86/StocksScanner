name: Daily penny scans

on:
  schedule:
    - cron: "0 7 * * 1-5"
      timezone: America/Denver
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scan mega-cap + pennies, macro brief, email digest
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFY_EMAIL_TO: ${{ secrets.NOTIFY_EMAIL_TO }}
          NOTIFY_EMAIL_FROM: ${{ secrets.NOTIFY_EMAIL_FROM }}
        run: python scripts/scoring/daily-penny9-scan.py --digest

      - name: Commit snapshot
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/timeseries/*.csv research/reports/*-scan.md
          if git diff --cached --quiet; then
            echo "No snapshot changes"
          else
            git commit -m "chore: daily morning digest snapshots"
            git push
          fi
