name: Daily market movers

on:
  schedule:
    # 7:00 AM Mountain Standard Time (UTC-7 year-round; America/Phoenix does not observe DST)
    - cron: "0 7 * * 1-5"
      timezone: America/Phoenix
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scan market movers and email top-10 digest
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFY_EMAIL_TO: ${{ secrets.NOTIFY_EMAIL_TO }}
          NOTIFY_EMAIL_FROM: ${{ secrets.NOTIFY_EMAIL_FROM }}
        run: python scripts/scoring/daily-market-movers-scan.py

      - name: Commit snapshot
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/timeseries/market-movers.csv research/reports/*-market-movers-scan.md
          if git diff --cached --quiet; then
            echo "No snapshot changes"
          else
            git commit -m "chore: daily market movers snapshot"
            git push
          fi
