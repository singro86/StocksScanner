investor:
  experience: beginner
  broker: wealthsimple
  country: CA
  currency: CAD
  account_priority: TFSA
  risk_tolerance: aggressive
  growth_style: garp
  agent_mode: manual
  goal:
    north_star: 1000000
    north_star_currency: CAD
    target_date: "2027-12-31"
    realistic_milestone_2027: 30000
  contributions:
    starting_capital_max: 10000
    monthly_range: [500, 1000]
  constraints:
    no_options_until_experienced: true
    no_margin: true
    max_single_stock_pct: 20
    max_sector_pct: 40
    min_garp_score: 60
    swap_score_delta: 15
  execution:
    broker_cli: manual
    execution_note: "Place trades in Wealthsimple app; update portfolio/holdings.yaml after fills"
    require_dry_run: true
    require_user_approval: true
    max_trades_per_day: 5
    max_trades_per_hour: 3
    tos_acknowledged: true
    paper_trading_weeks: 4
    paper_trading_start: "2026-08-13"
    paper_trading_complete: false
  drawdown:
    protocol: strict
    pause_new_buys_at_pct: 15
    recovery_within_pct_of_peak: 10
    review_only_mode: true
    benchmark: QQQ
  discovery:
    mode: hybrid
    static_core_size: 20
    screener_frequency: monthly
    screener_max_new: 3
  notifications:
    channel: email
    daily_scan: true
    trade_approval: true
    drawdown_alert: true
  cold_start:
    strategy: full_garp
    initial_positions: 4
    min_position_cad: 1000
