#   python scripts/scoring/daily-penny9-scan.py --universe portfolio/penny-secondary-watchlist.yaml
#
# Selection rule: US major-exchange listing, last price under 5.00 USD,
# positive TTM net income, 3-month average dollar volume above 1M USD,
# no going-concern doubt. Ranked by fluctuation_pct - the 52-week high-low
# spread as a percent of the current price. That is a range proxy, not
# realized volatility. The daily job accumulates real bars so realized
# volatility can replace it once the CSV has enough history.
#
# quality: every name is "watch". None has a Rebalance-MCP GARP score, so none
# may be auto-promoted to a buy by the scanner. "watch" is enforced in
# decide() - it returns WATCH and never PAPER_CANDIDATE.

