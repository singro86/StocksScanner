name: "1M Portfolio — Daily morning digest"
description: "Daily 7 AM MST scan of mega-cap core, primary penny-9, and secondary-20. Appends time series, writes paper-only recommendation, includes Fed/US–Iran/gold macro brief. Never places trades."
workflow:
  triggers:
    - cron:
        cron: "0 7 * * *"

  actions: []
  prompts:
    - |
      You are the North America GARP Portfolio Manager (see AGENTS.md and .cursor/agents/garp-portfolio-manager.md).
      Read the penny-scanner skill, then run the combined digest. Do not use Equibles for this price check.

      1. Read portfolio/profile.yaml and portfolio/peak-value.yaml
      2. Run: python scripts/scoring/daily-penny9-scan.py --digest
      3. Summarize: mega-cap core table (NVDA/MSFT/GOOGL/AAPL, display-only), then penny Buy / Sell / Hold / Watch / Avoid. Buy is paper-only.
      4. Note the Markets & macro block (gold GC=F, Fed, US–Iran) is produced by the script via Yahoo + Google News RSS — no MCP required.
      5. Secondary names are all quality: watch — never promote them. Mega-caps never take the paper Buy slot.
      6. If paper trading active, say so. This job never calls wsli and never sets TRADE_APPROVED.

      Include the not-financial-advice disclaimer.
  agentOptions:
    skipInstall: false
  memoryEnabled: true
gitConfig:
  repo: singro86/StocksScanner
  branch: main

notes: |
  Companion to .github/workflows/daily-penny9.yml (the GitHub Action is the durable runner).
  Schedule intent: every day 7:00 AM MST (America/Phoenix). Re-import this YAML in Cursor Automations if the cloud cron does not honor MST — Actions remains authoritative.
  This Cursor Automation is optional if Actions is already committing snapshots.
  Needs tzdata on the runner: uv run --python 3.12 --with tzdata --no-project python ...
